<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Старый Маркет</title>
<style>
body{margin:0;background:#e9e9e9;color:#222;font-family:sans-serif;font-size:15px;line-height:1.35}
#bar{background:#2b2b2b;border-bottom:3px solid #99cc00;padding:10px 12px;overflow:hidden}
#logo{float:left;color:#fff;font-size:20px;font-weight:bold}
#abtn{float:right;color:#fff;background:#444;padding:4px 10px;font-size:14px;text-decoration:none;margin-right:6px}
#sbtn{float:right;color:#fff;background:#444;padding:4px 10px;font-size:14px;text-decoration:none}
.pad{padding:10px}
.small{color:#666;font-size:13px}
.tile{display:block;padding:18px 10px;color:#fff;text-decoration:none;font-size:18px;font-weight:bold;text-align:center}
.sqw{float:left;width:50%}
.sq{display:block;position:relative;height:0;padding-bottom:96%;margin:4px;color:#fff;text-decoration:none;font-weight:bold;font-size:20px;text-shadow:1px 1px 2px #000}
.sq span{position:absolute;left:0;right:0;top:50%;margin-top:-13px;text-align:center}
.big{background:#ff8800;padding:20px 10px;font-size:20px;margin:4px}
.grid .tile{padding:32px 6px;font-size:17px}
.big span{display:block;font-size:13px;font-weight:normal}
.grid{width:100%;border-collapse:separate;border-spacing:4px;margin:0}
.grid td{padding:0;width:50%}
.t1{background:#99cc00}.t2{background:#33b5e5}.t3{background:#ffbb33}.t4{background:#aa66cc}.t5{background:#555}
h2{font-size:17px;margin:0;padding:10px;background:#d4d4d4;border-bottom:1px solid #bbb}
.nav{width:100%;border-collapse:collapse;background:#d4d4d4;border-bottom:1px solid #bbb}
.nav td{padding:0}
.nt{text-align:center;font-size:17px;font-weight:bold}
.na{width:60px}
.na a{display:block;padding:10px 0;text-align:center;font-size:24px;font-weight:bold;color:#fff;text-decoration:none;background:#99cc00}
.row{display:block;position:relative;min-height:48px;padding:8px 8px 8px 68px;background:#fff;border-bottom:1px solid #ddd;color:#222;text-decoration:none}
.row.bad{opacity:.55}
.rn{display:block;font-weight:bold;font-size:16px}
.rm{display:block;color:#777;font-size:13px}
.ic{position:absolute;left:8px;top:8px;width:48px;height:48px;background:#99cc00;color:#fff;text-align:center;line-height:48px;font-size:26px;font-weight:bold}
.det{background:#fff;padding:10px;position:relative;min-height:70px}
.det .ic{position:static;float:left;margin-right:10px}
.inst{display:block;margin:12px 0;padding:14px;background:#669900;color:#fff;text-align:center;font-size:18px;font-weight:bold;text-decoration:none}
.warn{background:#fff3cd;border:1px solid #e0c060;padding:8px;font-size:13px;margin:8px 0}
label{display:block;margin-top:12px}
input,select{width:100%;box-sizing:border-box;padding:10px;font-size:16px}
.foot{color:#777;font-size:12px;padding:10px;text-align:center}
.foot a{color:#555}
</style>
</head>
<body>
<div id="bar"><span id="logo" onclick="go('home')">Старый Маркет</span><a id="sbtn" href="#search">Поиск</a><a id="abtn" href="#acc">Аккаунт</a></div>
<div id="view"><div class="pad">Загрузка каталога…</div></div>
<div class="foot">Каталог читается из apps.json.<br>Перед установкой разрешите «Неизвестные источники» в настройках.</div>
<script>
var NAMES={4:"1.6",5:"2.0",6:"2.0.1",7:"2.1",8:"2.2",9:"2.3",10:"2.3.3",11:"3.0",12:"3.1",13:"3.2",14:"4.0",15:"4.0.3",16:"4.1",17:"4.2",18:"4.3",19:"4.4"};
var VER2SDK=[["4.4",19],["4.3",18],["4.2",17],["4.1",16],["4.0.3",15],["4.0",14],["3.",11],["2.3.3",10],["2.3",9],["2.2",8],["2.1",7],["2.0",5],["1.6",4],["1.5",3]];
var ORDER=["apps","games","new","all"];
var TITLES={apps:"Приложения",games:"Игры",all:"Все приложения",featured:"Выбор редакции","new":"Новое"};
// Адрес вашего Cloudflare Worker:
var WORKER="https://ВАШ-WORKER.ВАШ-АККАУНТ.workers.dev";
var DATA=null,LAST="",ERR="",SDK=mySdk();
function $(i){return document.getElementById(i);}
function go(h){location.hash="#"+h;}
function mySdk(){var m=/Android (\d+(\.\d+)*)/.exec(navigator.userAgent),i;if(!m)return 99;for(i=0;i<VER2SDK.length;i++){if(m[1].indexOf(VER2SDK[i][0])===0)return VER2SDK[i][1];}return 99;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function icon(a){return a.icon?'<img class="ic" src="'+esc(a.icon)+'" width="48" height="48" alt="">':'<span class="ic">'+esc(String(a.name).charAt(0))+'</span>';}
function row(a){return '<a class="row'+(a.minSdk>SDK?' bad':'')+'" href="#app/'+esc(a.id)+'">'+icon(a)+'<span class="rn">'+esc(a.name)+'</span><span class="rm">'+esc(a.author)+' · v'+esc(a.version)+' · '+esc(a.size)+'</span></a>';}
function find(id){var i;for(i=0;i<DATA.length;i++){if(DATA[i].id===id)return DATA[i];}return null;}
function listOf(t){var r=[],i,a;
 if(t==="new"){for(i=DATA.length-1;i>=0&&r.length<10;i--)r.push(DATA[i]);return r;}
 for(i=0;i<DATA.length;i++){a=DATA[i];
  if(t==="apps"&&a.cat!=="app")continue;
  if(t==="games"&&a.cat!=="game")continue;
  if(t==="featured"&&!a.featured)continue;
  r.push(a);}
 return r;}
function rows(r){var s="",i;for(i=0;i<r.length;i++)s+=row(r[i]);return s||'<div class="pad small">Нет никаких приложений.</div>';}
function draw(h){
 var v=$("view"),p=h.split("/"),t=p[0],s="",i,a,f=null;
 window.scrollTo(0,0);
 if(!DATA){v.innerHTML='<div class="pad">Загрузка каталога…</div>';return;}
 if(t==="home"){
  for(i=0;i<DATA.length;i++){if(DATA[i].featured){f=DATA[i];break;}}
  s+='<div class="sqw"><a class="sq t1" href="#apps"><span>Приложения</span></a></div><div class="sqw"><a class="sq t2" href="#games"><span>Игры</span></a></div><div class="sqw"><a class="sq t4" href="#new"><span>Новое</span></a></div><div class="sqw"><a class="sq t5" href="#all"><span>Все</span></a></div><div style="clear:both"></div>';
  if(f)s+='<a class="tile big" href="#app/'+esc(f.id)+'">'+esc(f.name)+'<span>Рекомендуем</span></a>';
  if(ERR)s+='<div class="pad"><div class="warn"><b>Каталог не загрузился.</b><br>'+ERR+'</div></div>';
  s+='<div class="pad small">Ваш Android: '+(SDK===99?"не определён":"API "+SDK)+'. Подходящие приложения видны чётко, остальные бледные.</div>';
 }else if(t==="app"){
  a=find(p[1]);
  if(!a){s='<div class="pad">Приложение не найдено.</div>';}
  else{
   s+='<div class="det">'+icon(a)+'<b style="font-size:18px">'+esc(a.name)+'</b><br><span class="small">'+esc(a.author)+'</span><div style="clear:both"></div>';
   if(a.minSdk>SDK)s+='<div class="warn">Нужен Android '+(NAMES[a.minSdk]||a.minSdk)+' или новее. На вашем устройстве может не работать.</div>';
   s+='<a class="inst" href="'+esc(a.apk)+'">Установить</a>';
   s+='<p>'+esc(a.desc)+'</p><p class="small">Версия: '+esc(a.version)+'<br>Размер: '+esc(a.size)+'<br>Android: от '+(NAMES[a.minSdk]||a.minSdk)+'</p>';
   if(a.sha256)s+='<p class="small">SHA-256: '+esc(String(a.sha256).substring(0,16))+'…</p>';
   s+='</div>';}
 }else if(t==="acc"||t==="upload"||t==="admin"){accView(t);return;
 }else if(t==="search"){
  v.innerHTML='<div class="pad"><input id="q" placeholder="Поиск по названию"></div><div id="res"></div>';
  $("q").onkeyup=function(){var q=this.value.toLowerCase(),r=[],j;if(!q){$("res").innerHTML="";return;}for(j=0;j<DATA.length;j++){if(String(DATA[j].name).toLowerCase().indexOf(q)>-1)r.push(DATA[j]);}$("res").innerHTML=rows(r);};
  return;
 }else{
  if(!TITLES[t]){t="all";}
  var k,pv,nx;
  for(k=0;k<ORDER.length;k++){if(ORDER[k]===t)break;}
  pv=ORDER[(k+ORDER.length-1)%ORDER.length];nx=ORDER[(k+1)%ORDER.length];
  s='<table class="nav"><tr><td class="na"><a href="#'+pv+'">&lt;</a></td><td class="nt">'+TITLES[t]+'</td><td class="na"><a href="#'+nx+'">&gt;</a></td></tr></table>'+rows(listOf(t));
 }
 v.innerHTML=s;
}
var SES={tok:"",user:"",admin:false},ADMSG="",LOGMSG="";
function ld(){try{SES.tok=localStorage.getItem("tok")||"";SES.user=localStorage.getItem("usr")||"";SES.admin=localStorage.getItem("adm")==="1";}catch(e){}}
function sv(){try{localStorage.setItem("tok",SES.tok);localStorage.setItem("usr",SES.user);localStorage.setItem("adm",SES.admin?"1":"0");}catch(e){}}
function refresh(){LAST="";route();}
function logout(){SES={tok:"",user:"",admin:false};sv();if(location.hash!=="#acc")go("acc");refresh();}
function noSrv(){return WORKER.indexOf("ВАШ-")>-1;}
function api(path,data,cb,isForm,onprog){
 var r=new XMLHttpRequest();
 r.open("POST",WORKER+path,true);
 if(!isForm)r.setRequestHeader("Content-Type","text/plain");
 if(onprog&&r.upload)r.upload.onprogress=onprog;
 r.onreadystatechange=function(){if(r.readyState!==4)return;var j;
  try{j=(typeof JSON!=="undefined"&&JSON.parse)?JSON.parse(r.responseText):eval("("+r.responseText+")");}catch(e){j={error:"Нет ответа сервера (код "+r.status+")"};}
  if(r.status===401||(j&&j.banned)){if(j&&j.banned)LOGMSG="Аккаунт заблокирован.";logout();return;}
  cb(j,r.status);};
 r.send(isForm?data:JSON.stringify(data));
}
function hsh(s){var x=5381,i;for(i=0;i<s.length;i++){x=((x*33)^s.charCodeAt(i))>>>0;}return String(x);}
function dget(){try{return JSON.parse(localStorage.getItem("demo_users")||"{}");}catch(e){return {};}}
function dput(o){try{localStorage.setItem("demo_users",JSON.stringify(o));}catch(e){}}
function doAuth(p){
 var u=$("lu").value.toLowerCase(),pw=$("lp").value,reg=(p==="/register"),d;
 if(!u||!pw){$("ast").innerHTML="Введите имя и пароль.";return;}
 if(reg){
  if(!/^[a-z0-9_]{3,20}$/.test(u)){$("ast").innerHTML="Имя: 3–20 символов, латиница, цифры или _";return;}
  if(pw.length<6){$("ast").innerHTML="Пароль не короче 6 символов.";return;}
  if($("lp2").value!==pw){$("ast").innerHTML="Пароли не совпадают.";return;}
 }
 if(noSrv()){
  d=dget();
  if(reg){if(d[u]){$("ast").innerHTML="Такое имя уже занято.";return;}d[u]={h:hsh(pw),a:false};dput(d);}
  else if(!d[u]||d[u].h!==hsh(pw)){$("ast").innerHTML="Неверное имя или пароль.";return;}
  if(d[u].b){$("ast").innerHTML="Аккаунт заблокирован.";return;}
  SES={tok:"demo",user:u,admin:!!d[u].a};sv();refresh();return;
 }
 $("ast").innerHTML="Подождите…";
 api(p,{user:u,pass:pw},function(j){
  if(j.ok){SES={tok:j.token,user:j.user,admin:!!j.admin};sv();refresh();}
  else $("ast").innerHTML=esc(j.error||"Ошибка");
 });
}
function getAdmin(){
 var k=$("ak").value.replace(/^\s+|\s+$/g,""),d;
 if(!k){$("ast").innerHTML="Введите ключ.";return;}
 if(noSrv()){
  if(k!=="demo"){$("ast").innerHTML="Неверный ключ администратора.";return;}
  d=dget();d[SES.user]=d[SES.user]||{};d[SES.user].a=true;dput(d);SES.admin=true;sv();refresh();return;
 }
 api("/admin",{token:SES.tok,key:k},function(j){
  if(j.ok){SES.admin=true;sv();refresh();}else $("ast").innerHTML=esc(j.error||"Ошибка");
 });
}
function accView(t){
 var v=$("view"),s,i,mine=[],note=noSrv()?'<div class="warn">Демо-режим: сервер не подключён, аккаунт хранится только на этом устройстве. Ключ администратора в демо: <b>demo</b>.</div>':'';
 ld();
 if(!SES.tok){
  if(t!=="acc"){go("acc");return;}
  v.innerHTML='<h2>Аккаунт</h2><div class="pad">'+note+'<p class="small">Войдите или создайте аккаунт. С аккаунтом можно выкладывать приложения.</p><label>Имя<input id="lu" autocapitalize="off"></label><label>Пароль<input id="lp" type="password"></label><label>Пароль ещё раз (при создании)<input id="lp2" type="password"></label><a class="inst" href="#" onclick="doAuth(\'/login\');return false;">Войти</a><a class="inst" style="background:#555" href="#" onclick="doAuth(\'/register\');return false;">Создать аккаунт</a><div id="ast" class="small">'+esc(LOGMSG)+'</div></div>';
  LOGMSG="";
  return;
 }
 if(t==="upload"){uploadForm();return;}
 if(t==="admin"){if(!SES.admin){go("acc");return;}adminView();return;}
 for(i=0;i<DATA.length;i++){if(DATA[i].author===SES.user)mine.push(DATA[i]);}
 s='<h2>Профиль</h2><div class="pad">'+note+'<div class="det" style="min-height:0;margin-bottom:10px"><span class="ic">'+esc(SES.user.charAt(0).toUpperCase())+'</span><b style="font-size:18px">'+esc(SES.user)+'</b><br><span class="small">'+(SES.admin?'Администратор':'Пользователь')+' · приложений: '+mine.length+'</span><div style="clear:both"></div></div><a class="inst" href="#upload">Загрузить приложение</a>';
 if(SES.admin)s+='<a class="inst" style="background:#33b5e5" href="#admin">Панель администратора</a>';
 else s+='<label>Ключ администратора<input id="ak" type="password" autocapitalize="off" autocorrect="off"></label><a class="inst" style="background:#555" href="#" onclick="getAdmin();return false;">Получить права администратора</a>';
 s+='<div id="ast" class="small"></div></div><h2>Мои приложения</h2>'+rows(mine)+'<div class="pad"><a href="#" onclick="logout();return false;">Выйти</a></div>';
 v.innerHTML=s;
}
function uploadForm(){
 $("view").innerHTML='<h2>Загрузка приложения</h2><div class="pad"><div class="small">Вы: '+esc(SES.user)+'</div>'+(noSrv()?'<div class="warn">Демо: загрузка заработает после подключения сервера.</div>':'')+'<label>Название<input id="un"></label><label>Категория<select id="uc"><option value="app">Приложение</option><option value="game">Игра</option></select></label><label>Версия<input id="uv" value="1.0"></label><label>Минимальный Android<select id="us"><option value="4">1.6</option><option value="5">2.0</option><option value="7">2.1</option><option value="8">2.2</option><option value="9">2.3</option><option value="14">4.0</option><option value="16">4.1</option><option value="17">4.2</option><option value="18">4.3</option><option value="19">4.4</option></select></label><label>Файл APK<input id="uf" type="file"></label><a class="inst" href="#" onclick="sendUp();return false;">Загрузить</a><div id="ust" class="small">Заполните форму.</div></div>';
}
function sendUp(){
 if(noSrv()){$("ust").innerHTML="Демо: без сервера файл не отправляется.";return;}
 var f=$("uf").files&&$("uf").files[0],d;
 if(!$("un").value||!f){$("ust").innerHTML="Введите название и выберите APK.";return;}
 if(typeof FormData==="undefined"){$("ust").innerHTML="Этот браузер не умеет загружать файлы. Откройте сайт на Android 4.x или на компьютере.";return;}
 d=new FormData();
 d.append("token",SES.tok);d.append("name",$("un").value);d.append("cat",$("uc").value);d.append("version",$("uv").value);d.append("minSdk",$("us").value);d.append("file",f);
 api("/upload",d,function(j){$("ust").innerHTML=j.ok?esc(j.msg):"Ошибка: "+esc(j.error||"");},true,function(e){if(e.lengthComputable)$("ust").innerHTML="Отправка: "+Math.round(e.loaded*100/e.total)+"%";});
}
function adm(p,id,from){
 if(noSrv()){ADMSG="Демо: действует только с подключённым сервером.";adminView();return;}
 api(p,{token:SES.tok,id:id,from:from||""},function(j){ADMSG=j.ok?"Готово. Сайт обновится через минуту.":"Ошибка: "+(j.error||"");adminView();});
}
function usr(p,name){
 var d;
 if(noSrv()){d=dget();if(d[name]){d[name].b=(p==="/ban");dput(d);ADMSG=(p==="/ban"?"Заблокирован: ":"Разблокирован: ")+name;}adminView();return;}
 api(p,{token:SES.tok,name:name},function(j){ADMSG=j.ok?"Готово.":"Ошибка: "+(j.error||"");adminView();});
}
function btn(txt,col,js){return '<a class="inst" style="background:'+col+';padding:8px;margin:6px 0" href="#" onclick="'+js+';return false;">'+txt+'</a>';}
function pendRow(a){return '<div class="row" style="padding-left:8px"><span class="rn">'+esc(a.name)+'</span><span class="rm">'+esc(a.author)+' · v'+esc(a.version)+' · Android от '+(NAMES[a.minSdk]||a.minSdk)+' · '+esc(a.size)+'</span><span class="rm">SHA-256: '+esc(String(a.sha256||"").substring(0,16))+'…</span><a href="'+esc(a.apk)+'">Скачать и проверить APK</a>'+btn("Одобрить","#669900","adm('/approve','"+esc(a.id)+"')")+btn("Отклонить","#555","adm('/delete','"+esc(a.id)+"','pending')")+'</div>';}
function userRows(us){var s="",i,u,n;for(i=0;i<us.length;i++){u=us[i];n=esc(u.name);s+='<div class="row" style="padding-left:8px"><span class="rn">'+n+(u.admin?' (админ)':'')+(u.banned?' — заблокирован':'')+'</span>'+(u.admin?'':(u.banned?btn("Разблокировать","#669900","usr('/unban','"+n+"')"):btn("Заблокировать","#c33","usr('/ban','"+n+"')")))+'</div>';}return s||'<div class="pad small">Пользователей нет.</div>';}
function adminView(){
 var d,us=[],k;
 $("view").innerHTML='<h2>Панель администратора</h2><div class="pad small" id="ad">Загрузка…</div>';
 function show(pend,us){
  var s="",i;
  if(ADMSG)s+='<div class="warn">'+esc(ADMSG)+'</div>';
  if(noSrv())s+='<div class="warn">Демо: очередь для примера, блокировка работает только на этом устройстве.</div>';
  s+='<b>На проверке ('+pend.length+')</b>';
  for(i=0;i<pend.length;i++)s+=pendRow(pend[i]);
  s+='<p><b>Пользователи ('+us.length+')</b></p>'+userRows(us);
  s+='<p><b>Каталог ('+DATA.length+')</b></p>';
  for(i=0;i<DATA.length;i++)s+='<div class="row" style="padding-left:8px"><span class="rn">'+esc(DATA[i].name)+'</span><span class="rm">'+esc(DATA[i].author)+' · v'+esc(DATA[i].version)+'</span>'+btn("Удалить","#c33","adm('/delete','"+esc(DATA[i].id)+"')")+'</div>';
  ADMSG="";$("ad").innerHTML=s;
 }
 if(noSrv()){
  d=dget();for(k in d){us.push({name:k,admin:!!d[k].a,banned:!!d[k].b});}
  show([{id:"demo-1",name:"Пример на проверке",author:"ivan",version:"1.0",minSdk:4,size:"1.0 МБ",sha256:"abcdef0123456789",apk:"#"}],us);return;
 }
 api("/pending",{token:SES.tok},function(j){
  if(!j.ok){$("ad").innerHTML=esc(j.error||"Ошибка");return;}
  api("/users",{token:SES.tok},function(u){show(j.apps,u.ok?u.users:[]);});
 });
}
function route(){var h=location.hash.replace("#","")||"home";if(h===LAST)return;LAST=h;draw(h);}
setInterval(route,250);
var x=new XMLHttpRequest();
x.open("GET","apps.json?t="+(new Date()).getTime(),true);
x.onreadystatechange=function(){
 if(x.readyState!==4)return;
 try{var t=x.responseText;var j=(typeof JSON!=="undefined"&&JSON.parse)?JSON.parse(t):eval("("+t+")");DATA=j.apps;LAST="";route();}
 catch(e){
  var why=(location.protocol==="file:")?"Страница открыта как файл. Откройте сайт по адресу GitHub Pages (https://ник.github.io/...), а не из памяти телефона.":(x.status===404?"Файл apps.json не найден. Загрузите его в корень репозитория рядом с index.html.":"Файл apps.json повреждён (проверьте запятые и кавычки) или не загрузился. Код: "+x.status+".");
  ERR=why;DATA=[];LAST="";route();}
};
x.send(null);
</script>
</body>
</html>
