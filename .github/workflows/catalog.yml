name: Update catalog
on:
  push:
    paths:
      - "apps/**"
      - "games/**"
      - "build_catalog.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 build_catalog.py
      - run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps.json
          git diff --cached --quiet || (git commit -m "Update catalog" && git push)
